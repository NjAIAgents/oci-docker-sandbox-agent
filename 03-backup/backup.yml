---
# 03-backup/backup.yml — Deploy encrypted Postgres backup script + crontab
#
# What this playbook does:
#   1. Installs OCI CLI on the VM (if not present)
#   2. Deploys /usr/local/bin/pg-backup.sh and pg-restore.sh from repo
#   3. Writes /etc/ods/backup.env with the Vault token (root:root 600)
#      The encryption key is fetched from Vault at runtime — not stored on disk.
#   4. Ensures cron job runs daily at 02:00 UTC as root
#
# Idempotent — re-running corrects any drift from manual edits on the server.
#
# Secrets consumed (passed as extra-vars by the workflow):
#   vault_token   — Vault token with read access to secret/engagehub/backup

- name: Deploy Postgres backup
  hosts: ods_vm
  become: true

  vars:
    backup_script_src:  "{{ playbook_dir }}/pg-backup.sh"
    backup_script_dest: /usr/local/bin/pg-backup.sh
    restore_script_src:  "{{ playbook_dir }}/pg-restore.sh"
    restore_script_dest: /usr/local/bin/pg-restore.sh
    backup_env_file:    /etc/ods/backup.env
    backup_cron_hour:   "2"
    backup_cron_minute: "0"

  tasks:

    # ── 1. OCI CLI ───────────────────────────────────────────────────────────
    - name: Check if OCI CLI is installed
      command: oci --version
      register: oci_check
      changed_when: false
      failed_when: false

    - name: Install OCI CLI
      shell: |
        curl -sL https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh \
          | bash -s -- --accept-all-defaults
      when: oci_check.rc != 0
      args:
        executable: /bin/bash

    - name: Symlink oci into /usr/local/bin
      file:
        src: /root/bin/oci
        dest: /usr/local/bin/oci
        state: link
      when: oci_check.rc != 0

    # ── 2. Backup + restore scripts ──────────────────────────────────────────
    - name: Deploy backup script
      copy:
        src:   "{{ backup_script_src }}"
        dest:  "{{ backup_script_dest }}"
        owner: root
        group: root
        mode:  "0750"

    - name: Deploy restore script
      copy:
        src:   "{{ restore_script_src }}"
        dest:  "{{ restore_script_dest }}"
        owner: root
        group: root
        mode:  "0750"

    # ── 3. Encryption key ────────────────────────────────────────────────────
    - name: Ensure /etc/ods directory exists
      file:
        path:  /etc/ods
        state: directory
        owner: root
        group: root
        mode:  "0700"

    - name: Write backup env file with Vault token
      copy:
        dest:    "{{ backup_env_file }}"
        content: "VAULT_TOKEN={{ vault_token }}\n"
        owner:   root
        group:   root
        mode:    "0600"

    # ── 4. Cron job ──────────────────────────────────────────────────────────
    - name: Ensure cron job is present
      cron:
        name:   "engagehub postgres daily backup"
        user:   root
        hour:   "{{ backup_cron_hour }}"
        minute: "{{ backup_cron_minute }}"
        job:    "{{ backup_script_dest }} >> /var/log/pg-backup.log 2>&1"
        state:  present

    # ── 5. Summary ───────────────────────────────────────────────────────────
    - name: Verify cron entry
      command: crontab -l -u root
      register: cron_list
      changed_when: false

    - name: Print summary
      debug:
        msg:
          - "================================================"
          - "  Backup deployment complete"
          - "  Backup script:  {{ backup_script_dest }}"
          - "  Restore script: {{ restore_script_dest }}"
          - "  Key file: {{ backup_env_file }} (root:root 600)"
          - "  Schedule: daily at {{ backup_cron_hour }}:{{ backup_cron_minute }}0 UTC"
          - "  Log: /var/log/pg-backup.log"
          - "================================================"
