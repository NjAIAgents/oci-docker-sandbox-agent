name: Provision OCI VM

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  provision:
    name: Provision VM.Standard.A1.Flex
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read   # checkout
      issues: write    # open notification issue on success
      actions: write   # disable this workflow on success

    steps:

      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      # ── 2. Install Terraform ──────────────────────────────────────────────────
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: "~1.7"
          terraform_wrapper: false

      # ── 3. Install OCI CLI ────────────────────────────────────────────────────
      - name: Install OCI CLI
        run: |
          curl -sL https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh \
            | bash -s -- --accept-all-defaults
          echo "$HOME/bin" >> "$GITHUB_PATH"
          echo "$HOME/lib/oracle-cli/bin" >> "$GITHUB_PATH"

      # ── 4. Configure OCI credentials ─────────────────────────────────────────
      - name: Configure OCI credentials
        run: |
          mkdir -p ~/.oci
          printf '%s' "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\nkey_file=%s/.oci/oci_api_key.pem\ntenancy=%s\nregion=%s\n' \
            "$OCI_USER_OCID" "$OCI_FINGERPRINT" "$HOME" "$OCI_TENANCY_OCID" "$OCI_REGION" \
            > ~/.oci/config
          chmod 600 ~/.oci/config
        env:
          OCI_PRIVATE_KEY:  ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_USER_OCID:    ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT:  ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION:       ${{ secrets.OCI_REGION }}

      # ── 5. Verify OCI auth ────────────────────────────────────────────────────
      - name: Verify OCI connectivity
        run: oci iam region list --output table
        env:
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"

      # ── 6. Pre-flight: check if instance already exists ───────────────────────
      - name: Pre-flight instance check
        id: preflight
        run: |
          RAW=$(oci compute instance list \
            --compartment-id "$OCI_COMPARTMENT_ID" \
            --all 2>/dev/null || echo "")

          if [ -z "$RAW" ]; then
            COUNT=0
          else
            COUNT=$(echo "$RAW" | python3 -c "
          import sys, json
          data = json.load(sys.stdin).get('data', [])
          print(sum(1 for i in data
                    if i.get('shape') == 'VM.Standard.A1.Flex'
                    and i.get('lifecycle-state') != 'TERMINATED'))
          ")
          fi

          echo "instance_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Existing non-terminated A1 instances: $COUNT"
        env:
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}

      # ── 7. Fetch availability domains dynamically ─────────────────────────────
      - name: Fetch availability domains
        if: steps.preflight.outputs.instance_count == '0'
        id: ads
        run: |
          AD_JSON=$(oci iam availability-domain list \
            --compartment-id "$OCI_TENANCY_OCID" \
            --output json)

          AD_LIST=$(echo "$AD_JSON" | python3 -c "
          import sys, json
          ads = [d['name'] for d in json.load(sys.stdin)['data']]
          print(' '.join(ads))
          ")

          AD_COUNT=$(echo "$AD_JSON" | python3 -c "
          import sys, json
          print(len(json.load(sys.stdin)['data']))
          ")

          echo "ad_list=$AD_LIST"   >> "$GITHUB_OUTPUT"
          echo "ad_count=$AD_COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $AD_COUNT availability domain(s): $AD_LIST"
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}

      # ── 8. Network: check if VCN/subnet already exist, create if not ──────────
      # Uses OCI CLI to look up existing ods-vcn. If found, reads subnet_id
      # directly — no Terraform needed. If not found, runs terraform apply once.
      - name: Setup network
        if: steps.preflight.outputs.instance_count == '0'
        id: network
        run: |
          # Check for existing VCN named ods-vcn
          VCN_JSON=$(oci network vcn list \
            --compartment-id "$OCI_COMPARTMENT_ID" \
            --all --output json 2>/dev/null || echo '{"data":[]}')

          SUBNET_ID=$(echo "$VCN_JSON" | python3 -c "
          import sys, json, subprocess, os
          vcns = [v for v in json.load(sys.stdin)['data']
                  if v.get('display-name') == 'ods-vcn'
                  and v.get('lifecycle-state') != 'TERMINATED']
          if not vcns:
              print('')
              sys.exit(0)
          vcn_id = vcns[0]['id']
          # VCN exists — fetch subnet ID via OCI CLI
          result = subprocess.run([
              'oci', 'network', 'subnet', 'list',
              '--compartment-id', os.environ['OCI_COMPARTMENT_ID'],
              '--vcn-id', vcn_id,
              '--output', 'json'
          ], capture_output=True, text=True)
          subnets = json.loads(result.stdout).get('data', [])
          active = [s for s in subnets if s.get('lifecycle-state') != 'TERMINATED']
          print(active[0]['id'] if active else '')
          ")

          if [ -n "$SUBNET_ID" ]; then
            echo "::add-mask::$SUBNET_ID"
            echo "Network already exists. Subnet: ***"
            echo "subnet_id=$SUBNET_ID" >> "$GITHUB_OUTPUT"
          else
            echo "No existing network found — creating with Terraform..."

            # Write tfvars
            python3 -c "
          import os
          open('01-provision/network/terraform.tfvars', 'w').write(
            'compartment_id = \"' + os.environ['OCI_COMPARTMENT_ID'] + '\"\n' +
            'region         = \"' + os.environ['OCI_REGION'] + '\"\n'
          )
          "
            terraform -chdir=01-provision/network init
            terraform -chdir=01-provision/network apply -auto-approve \
              -var "tenancy_ocid=$OCI_TENANCY_OCID"

            SUBNET_ID=$(terraform -chdir=01-provision/network output -raw subnet_id)
            echo "::add-mask::$SUBNET_ID"
            echo "Network created. Subnet: ***"
            echo "subnet_id=$SUBNET_ID" >> "$GITHUB_OUTPUT"
          fi
        env:
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_REGION:         ${{ secrets.OCI_REGION }}

      # ── 9. Write instance tfvars ───────────────────────────────────────────────
      - name: Write instance tfvars
        if: steps.preflight.outputs.instance_count == '0'
        run: |
          python3 -c "
          import os
          open('01-provision/instance/terraform.tfvars', 'w').write(
            'compartment_id  = \"' + os.environ['OCI_COMPARTMENT_ID'] + '\"\n' +
            'region          = \"' + os.environ['OCI_REGION'] + '\"\n' +
            'instance_ocpus  = 4\n' +
            'instance_memory = 24\n' +
            'ssh_public_key  = \"' + os.environ['SSH_PUBLIC_KEY'].strip() + '\"\n'
          )
          "
        env:
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_REGION:         ${{ secrets.OCI_REGION }}
          SSH_PUBLIC_KEY:     ${{ secrets.SSH_PUBLIC_KEY }}

      # ── 10. Terraform init — instance ─────────────────────────────────────────
      - name: Terraform init — instance
        if: steps.preflight.outputs.instance_count == '0'
        run: terraform -chdir=01-provision/instance init

      # ── 11. Try each AD dynamically ───────────────────────────────────────────
      - name: Try all availability domains
        if: steps.preflight.outputs.instance_count == '0'
        id: instance
        run: |
          SUBNET_ID="${{ steps.network.outputs.subnet_id }}"
          SUCCESS=false

          for AD in ${{ steps.ads.outputs.ad_list }}; do
            echo ""
            echo "--- Attempting AD: $AD ---"

            # Clean up any partial instance state
            terraform -chdir=01-provision/instance destroy -auto-approve \
              -var "availability_domain=$AD" \
              -var "subnet_id=$SUBNET_ID" \
              -var "tenancy_ocid=$OCI_TENANCY_OCID" 2>&1 || true

            # Attempt instance creation
            if terraform -chdir=01-provision/instance apply -auto-approve \
                -var "availability_domain=$AD" \
                -var "subnet_id=$SUBNET_ID" \
                -var "tenancy_ocid=$OCI_TENANCY_OCID" 2>&1; then
              echo "ad_used=$AD" >> "$GITHUB_OUTPUT"
              SUCCESS=true
              break
            else
              echo "No capacity in $AD. Trying next..."
            fi
          done

          if [ "$SUCCESS" = "true" ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}

      # ── 12. Report result ─────────────────────────────────────────────────────
      - name: Report success
        if: steps.instance.outputs.success == 'true'
        id: report
        run: |
          PUBLIC_IP=$(terraform -chdir=01-provision/instance output -raw public_ip 2>/dev/null || echo "unknown")
          INSTANCE_ID=$(terraform -chdir=01-provision/instance output -raw instance_id 2>/dev/null || echo "unknown")
          echo "::add-mask::$PUBLIC_IP"
          echo "::add-mask::$INSTANCE_ID"
          echo "public_ip=$PUBLIC_IP"     >> "$GITHUB_OUTPUT"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "::notice title=VM Provisioned::Instance provisioned in AD: ${{ steps.instance.outputs.ad_used }} — check OCI Console for details"
          echo ""
          echo "================================================"
          echo "  SUCCESS — OCI VM provisioned"
          echo "  AD: ${{ steps.instance.outputs.ad_used }}"
          echo "  (IP and instance ID masked — check OCI Console)"
          echo "================================================"

      # ── 13. Open GitHub Issue — triggers email notification to repo owner ─────
      - name: Notify via GitHub Issue
        if: steps.instance.outputs.success == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '✅ OCI VM Provisioned',
              body: [
                '## Your OCI Always Free VM is ready!',
                '',
                `Provisioned in availability domain: **${{ steps.instance.outputs.ad_used }}**`,
                '',
                'To find your instance details:',
                '1. Go to **OCI Console → Compute → Instances**',
                '2. Select your sandbox compartment',
                '3. Click on **ods-instance** to see the public IP and instance details',
                '4. SSH in with: `ssh ubuntu@<public-ip>`',
                '',
                '> The provisioning workflow has been disabled and will not run again.',
                '> Close this issue once you have noted your instance details.',
              ].join('\n'),
            })
        env:
          PUBLIC_IP:   ${{ steps.report.outputs.public_ip }}
          INSTANCE_ID: ${{ steps.report.outputs.instance_id }}

      # ── 14. Disable this workflow — no more scheduled runs needed ─────────────
      - name: Disable provisioning workflow
        if: steps.instance.outputs.success == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.disableWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'provision-vm.yml',
            })

      - name: Report no capacity
        if: steps.preflight.outputs.instance_count == '0' && steps.instance.outputs.success == 'false'
        run: |
          echo "::warning title=No capacity::All ADs had no capacity this run. Will retry in 15 minutes."

      - name: Report already provisioned
        if: steps.preflight.outputs.instance_count != '0'
        run: |
          echo "::notice title=Already provisioned::A1 instance already exists — skipping. Disable this workflow once your instance is running."
