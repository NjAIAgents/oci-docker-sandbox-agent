name: Provision Object Storage (Postgres Backups)

on:
  workflow_dispatch:

jobs:
  provision:
    name: Create ods-pg-backups bucket
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:

      # ── 1. Checkout ───────────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      # ── 2. Install Terraform ──────────────────────────────────────────────────
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: "~1.7"
          terraform_wrapper: false

      # ── 3. Configure OCI credentials ─────────────────────────────────────────
      - name: Configure OCI credentials
        run: |
          mkdir -p ~/.oci
          printf '%s' "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\nkey_file=%s/.oci/oci_api_key.pem\ntenancy=%s\nregion=%s\n' \
            "$OCI_USER_OCID" "$OCI_FINGERPRINT" "$HOME" "$OCI_TENANCY_OCID" "$OCI_REGION" \
            > ~/.oci/config
          chmod 600 ~/.oci/config
        env:
          OCI_PRIVATE_KEY:  ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_USER_OCID:    ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT:  ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION:       ${{ secrets.OCI_REGION }}

      # ── 4. Write tfvars ───────────────────────────────────────────────────────
      - name: Write tfvars
        run: |
          python3 -c "
          import os
          open('01-provision/objectstorage/terraform.tfvars', 'w').write(
            'compartment_id           = \"' + os.environ['OCI_COMPARTMENT_ID'] + '\"\n' +
            'region                   = \"' + os.environ['OCI_REGION'] + '\"\n' +
            'object_storage_namespace = \"' + os.environ['OCI_NAMESPACE'] + '\"\n' +
            'retention_days           = 30\n' +
            'notification_email       = \"' + os.environ['NOTIFICATION_EMAIL'] + '\"\n'
          )
          "
        env:
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_REGION:         ${{ secrets.OCI_REGION }}
          OCI_NAMESPACE:      ${{ secrets.OCI_NAMESPACE }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}

      # ── 5. Terraform init ─────────────────────────────────────────────────────
      - name: Terraform init
        run: terraform -chdir=01-provision/objectstorage init

      # ── 6. Import bucket if it already exists (no remote state) ───────────────
      - name: Import existing bucket if present
        run: |
          EXISTS=$(oci os bucket get \
            --bucket-name ods-pg-backups \
            --namespace "$OCI_NAMESPACE" \
            --output json 2>/dev/null || echo "")

          if [ -n "$EXISTS" ]; then
            echo "Bucket already exists — importing into Terraform state..."
            terraform -chdir=01-provision/objectstorage import \
              -var "tenancy_ocid=$OCI_TENANCY_OCID" \
              oci_objectstorage_bucket.pg_backups \
              "n/${OCI_NAMESPACE}/b/ods-pg-backups"
          else
            echo "Bucket does not exist — Terraform will create it."
          fi
        env:
          OCI_NAMESPACE:    ${{ secrets.OCI_NAMESPACE }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}

      # ── 7. Terraform apply ────────────────────────────────────────────────────
      - name: Terraform apply
        run: |
          terraform -chdir=01-provision/objectstorage apply -auto-approve \
            -var "tenancy_ocid=$OCI_TENANCY_OCID"
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}

      # ── 8. Print outputs ──────────────────────────────────────────────────────
      - name: Print outputs
        run: |
          echo "Bucket:    $(terraform -chdir=01-provision/objectstorage output -raw bucket_name)"
          echo "Namespace: $(terraform -chdir=01-provision/objectstorage output -raw namespace)"
