name: Provision Object Storage (Postgres Backups)

on:
  workflow_dispatch:

jobs:
  provision:
    name: Create ods-pg-backups bucket
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:

      # ── 1. Checkout ───────────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      # ── 2. Install Terraform ──────────────────────────────────────────────────
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: "~1.7"
          terraform_wrapper: false

      # ── 3. Install OCI CLI ────────────────────────────────────────────────────
      - name: Install OCI CLI
        run: |
          curl -sL https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh \
            | bash -s -- --accept-all-defaults
          echo "$HOME/bin" >> "$GITHUB_PATH"
          echo "$HOME/lib/oracle-cli/bin" >> "$GITHUB_PATH"

      # ── 4. Configure OCI credentials ─────────────────────────────────────────
      - name: Configure OCI credentials
        run: |
          mkdir -p ~/.oci
          printf '%s' "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\nkey_file=%s/.oci/oci_api_key.pem\ntenancy=%s\nregion=%s\n' \
            "$OCI_USER_OCID" "$OCI_FINGERPRINT" "$HOME" "$OCI_TENANCY_OCID" "$OCI_REGION" \
            > ~/.oci/config
          chmod 600 ~/.oci/config
        env:
          OCI_PRIVATE_KEY:  ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_USER_OCID:    ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT:  ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION:       ${{ secrets.OCI_REGION }}

      # ── 5. Write tfvars ───────────────────────────────────────────────────────
      - name: Write tfvars
        run: |
          python3 -c "
          import os
          open('01-provision/objectstorage/terraform.tfvars', 'w').write(
            'compartment_id           = \"' + os.environ['OCI_COMPARTMENT_ID'] + '\"\n' +
            'region                   = \"' + os.environ['OCI_REGION'] + '\"\n' +
            'object_storage_namespace = \"' + os.environ['OCI_NAMESPACE'] + '\"\n' +
            'retention_days           = 30\n' +
            'notification_email       = \"' + os.environ['NOTIFICATION_EMAIL'] + '\"\n'
          )
          "
        env:
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_REGION:         ${{ secrets.OCI_REGION }}
          OCI_NAMESPACE:      ${{ secrets.OCI_NAMESPACE }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}

      # ── 6. Terraform init ─────────────────────────────────────────────────────
      - name: Terraform init
        run: terraform -chdir=01-provision/objectstorage init

      # ── 7. Import existing resources into state ───────────────────────────────
      - name: Import existing resources if present
        env:
          OCI_NAMESPACE:      ${{ secrets.OCI_NAMESPACE }}
          OCI_TENANCY_OCID:   ${{ secrets.OCI_TENANCY_OCID }}
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
        run: |
          TF="terraform -chdir=01-provision/objectstorage"

          # --- Bucket ---
          if oci os bucket get --bucket-name ods-pg-backups --namespace "$OCI_NAMESPACE" --output json 2>/dev/null; then
            echo "Importing bucket..."
            $TF import -var "tenancy_ocid=$OCI_TENANCY_OCID" \
              oci_objectstorage_bucket.pg_backups "n/${OCI_NAMESPACE}/b/ods-pg-backups"

            # Lifecycle policy: provider v5 import is broken, delete and let Terraform recreate
            oci os object-lifecycle-policy delete \
              --bucket-name ods-pg-backups --namespace "$OCI_NAMESPACE" --force 2>/dev/null || true
          else
            echo "Bucket not found — Terraform will create it."
          fi

          # --- ONS topic ---
          TOPIC_ID=$(oci ons topic list --compartment-id "$OCI_COMPARTMENT_ID" --output json 2>/dev/null \
            | python3 -c "import sys,json; d=json.load(sys.stdin).get('data',[]); m=[t['topic-id'] for t in d if t.get('name')=='ods-pg-backup-alerts' and t.get('lifecycle-state')!='DELETED']; print(m[0] if m else '')")

          if [ -n "$TOPIC_ID" ]; then
            echo "Importing ONS topic $TOPIC_ID..."
            $TF import -var "tenancy_ocid=$OCI_TENANCY_OCID" \
              oci_ons_notification_topic.bucket_alerts "$TOPIC_ID"

            # --- ONS subscription ---
            SUB_ID=$(oci ons subscription list --compartment-id "$OCI_COMPARTMENT_ID" --topic-id "$TOPIC_ID" --output json 2>/dev/null \
              | python3 -c "import sys,json; d=json.load(sys.stdin).get('data',[]); m=[s['id'] for s in d if s.get('lifecycle-state')!='DELETED']; print(m[0] if m else '')")

            if [ -n "$SUB_ID" ]; then
              echo "Importing ONS subscription $SUB_ID..."
              $TF import -var "tenancy_ocid=$OCI_TENANCY_OCID" \
                oci_ons_subscription.bucket_alerts_email "$SUB_ID"
            fi
          else
            echo "ONS topic not found — Terraform will create it."
          fi

      # ── 8. Terraform apply ────────────────────────────────────────────────────
      - name: Terraform apply
        run: |
          terraform -chdir=01-provision/objectstorage apply -auto-approve \
            -var "tenancy_ocid=$OCI_TENANCY_OCID"
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}

      # ── 9. Print outputs ──────────────────────────────────────────────────────
      - name: Print outputs
        run: |
          echo "Bucket:    $(terraform -chdir=01-provision/objectstorage output -raw bucket_name)"
          echo "Namespace: $(terraform -chdir=01-provision/objectstorage output -raw namespace)"
